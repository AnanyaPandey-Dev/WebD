<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link
    href="44_forms_bootstrap.css"
    rel="stylesheet"> 
</head>
<body>
    <!-- learn about mb-3 in bootstrap utilities spacing-->
    <div class="container">
        <h2>Form Demo</h2>
        <form class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="text" class="form-control" placeholder="Email" id="email">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" placeholder="Password" id="password">
            <label class="form-label" for="address">Address</label>
            <input type="address" class="form-control-lg" placeholder="Address" id="address">
            <label class="form-label" for="address">Address</label>
            <input type="address" class="form-control-sm" placeholder="Address" id="address">
        </form>
        <br>
        <form>
            <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="text" class="form-control" placeholder="Email" id="email">
            </div>
            <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" placeholder="Password" id="password">
            </div>
            <div class="mb-3">
            <label class="form-label" for="address">Address</label>
            <input type="address" class="form-control-lg" placeholder="Address" id="address">
            </div>
            <div class="mb-3">
            <label class="form-label" for="address">Address</label>
            <input type="address" class="form-control-sm" placeholder="Address" id="address">
            </div>
        <div class="mb-3">
            <select class="form-select">
                <option selected>Choose your city</option>
                <option value="1">Mumbai</option>
                <option value="2">Delhi</option>
                <option value="3">Pune</option>
            </select>
        </div>
        <div class="mb-3">
            <select class="form-select-lg">
                <option selected>Choose your city</option>
                <option value="1">Mumbai</option>
                <option value="2">Delhi</option>
                <option value="3">Pune</option>
            </select>
        </div>
        <div class="mb-3">
            <select class="form-select-sm">
                <option selected>Choose your city</option>
                <option value="1">Mumbai</option>
                <option value="2">Delhi</option>
                <option value="3">Pune</option>
            </select>
        </div>
        <div class="mb-3">
            <select class="form-select" disabled>
                <option selected>Choose your city</option>
                <option value="1">Mumbai</option>
                <option value="2">Delhi</option>
                <option value="3">Pune</option>
            </select>
        </div>
        <div class="normal mb-3">
            <label for="agree">Agree</label>
            <input type="checkbox" id="agree">
        </div>
        <div class="form-check mb-3">
            <label for="agreebs" class="form-check-label">Agree</label>
            <input type="checkbox" id="agreebs" class="form-check-input">
        </div>
        <div class="form-check mb-3">
            <label for="radiobs" class="form-check-label">Yes/No</label>
            <input type="radio" id="radiobs" class="form-check-input">
        </div>
        <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="switchCheckDefault">
            <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
        </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
