<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>as7_bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <h2 class="text-center">Pricing</h2>
    <h6 class="card-subtitle mb-2 text-body-secondaryb text-center">Please checkout our most effective payment models</h6>
    <div class="row text-center justify-content-evenly">
        <div class="card col-sm-5 col-md-3 mb-3 me-3">
                <div class="card-header text-center">
                        Free
                </div>
            <div class="card-body">
                <h2 class="card-title fs-1 text-center">$0/mo</h2>
                <h6 class="card-subtitle mb-2 text-body-secondaryb text-center">10 users included<br>2 GB of storage<br>Email support</h6>
                <div class="d-grid justify-content-center">
                    <button type="button" class="btn btn-outline-primary ">Sign up for free</button>
                </div>
            </div>
        </div>
        <div class="card col-sm-5 col-md-3 mb-3 me-3" >
                <div class="card-header text-center">
                        Pro
                </div>
            <div class="card-body">
                <h2 class="card-title fs-1 text-center">$15/mo</h2>
                <h6 class="card-subtitle mb-2 text-body-secondaryb text-center">20 users included<br>10 GB of storage<br>Priority email support</h6>
                <div class="d-grid justify-content-center">
                    <button type="button" class="btn btn-primary ">Get started</button>
                </div>
            </div>
        </div>
        <div class="card col-sm-10 col-md-3 mb-3 me-3" >
                <div class="card-header text-center">
                        Enterprise
                </div>
            <div class="card-body">
                <h2 class="card-title fs-1 text-center">$29/mo</h2>
                <h6 class="card-subtitle mb-2 text-body-secondaryb text-center">30 users included<br>15 GB of storage<br>Phone & email support</h6>
                <div class="d-grid justify-content-center">
                    <button type="button" class="btn btn-primary ">Contact us</button>
                </div>
            </div>
        </div>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
